  gamma: 0.3
  noise: 0.1
  step_size: 6
  alpha: 0
  beta: 1
  temperature: 0.05
  network:
    cuDNN_support: False
    use_lstm_input: True
    use_dueling: False
    use_double: True
    skip_error: 0
    layers:
      1: 64
      2: 64
