  policy: "eps_greedy"
  batch_size: 32
  n_batch: 1
  pretrain_length: 32
  target_update: 20
  hidden_size: 128
  learning_rate: 0.0001
  eps_init: 0.99
  eps_decay: 0.99
  explore_start: .99
  explore_stop: 0.001
