  state_design: 2
  pos_dist: 2
  state_bins: 10
  state_range: 250
  add_reward: False
  add_index: True
  port: 5555
  sim_start: False
  sim_seed: 0
EnvironmentTest:
  congestion_test: True
  load_positions: False
  load_file_pos: "save_results/realness/drqn/config_realness_pos_store/positions_2000.npy"
  num_channels: 3
  num_users: 4
  mobility: True
  mobility_vary: False
  highway_length: 100
  enable_fingerprint: False
